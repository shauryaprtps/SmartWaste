
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartWaste | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7f5;
            color: #20382d;
            min-height: 100vh;
        }

        header {
            height: 75px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #123d30;
            color: white;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            background: #1eaa65;
            font-size: 25px;
        }

        .brand h2 {
            font-size: 19px;
        }

        .brand p {
            color: #b6d3c4;
            font-size: 10px;
            letter-spacing: 1px;
            margin-top: 3px;
        }

        .back-link {
            color: #d8e8df;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: white;
        }

        main {
            min-height: calc(100vh - 75px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 445px;
            background: white;
            border: 1px solid #e4ece6;
            border-radius: 15px;
            padding: 36px;
            box-shadow: 0 8px 30px rgba(20, 50, 35, 0.06);
        }

        .role-icon {
            width: 55px;
            height: 55px;
            border-radius: 13px;
            background: #e6f3e9;
            display: grid;
            place-items: center;
            font-size: 26px;
            margin-bottom: 20px;
        }

        .role-label {
            display: inline-block;
            background: #eaf4ed;
            color: #267650;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 13px;
        }

        h1 {
            font-size: 26px;
            color: #193b2c;
            margin-bottom: 9px;
        }

        .subtitle {
            font-size: 13px;
            line-height: 1.6;
            color: #829087;
            margin-bottom: 27px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #405449;
            font-size: 12px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 45px;
            padding: 0 13px;
            border: 1px solid #dce5df;
            border-radius: 8px;
            outline: none;
            background: white;
            color: #253b30;
            font-size: 13px;
        }

        input:focus {
            border-color: #176b4a;
            box-shadow: 0 0 0 3px rgba(23, 107, 74, 0.08);
        }

        .password-options {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 20px;
            color: #718078;
            font-size: 12px;
        }

        .password-options input {
            width: 14px;
            height: 14px;
        }

        .primary-btn {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 8px;
            background: #176747;
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .primary-btn:hover {
            background: #104d36;
        }

        .switch-text {
            text-align: center;
            color: #7b8981;
            font-size: 12px;
            margin-top: 22px;
        }

        .switch-btn {
            border: none;
            background: none;
            color: #176b4a;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }

        .switch-btn:hover {
            text-decoration: underline;
        }

        .role-notice {
            background: #f0f6f1;
            border: 1px solid #e2ede4;
            border-radius: 8px;
            padding: 13px;
            margin-top: 19px;
            color: #61786a;
            font-size: 11px;
            line-height: 1.6;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 12px;
            line-height: 1.5;
            background: #fff3df;
            color: #92601d;
        }

        .message.show {
            display: block;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 500px) {
            .auth-card {
                padding: 25px 21px;
            }

            header {
                padding: 0 18px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">
            <div class="brand-icon">♻</div>
            <div>
                <h2>SmartWaste</h2>
                <p>MANAGEMENT SYSTEM</p>
            </div>
        </div>

        <a href="index.html" class="back-link">← Change Portal</a>
    </header>

    <main>
        <section class="auth-card">

            <div class="role-icon" id="roleIcon">♻</div>

            <span class="role-label" id="roleLabel">CITIZEN PORTAL</span>

            <h1 id="pageTitle">Welcome Back</h1>

            <p class="subtitle" id="pageSubtitle">
                Sign in to access your SmartWaste account.
            </p>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your registered email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="password-options">
                    <input type="checkbox" id="showPassword">
                    <label for="showPassword" style="margin:0;font-weight:400;">
                        Show password
                    </label>
                </div>

                <button type="submit" class="primary-btn">
                    Login to Portal →
                </button>

            </form>

            <!-- REGISTRATION FORM -->
            <form id="registerForm" class="hidden">

                <div class="form-group">
                    <label for="registerName">Full Name</label>
                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="registerPhone">Mobile Number</label>
                    <input
                        type="tel"
                        id="registerPhone"
                        placeholder="10-digit mobile number"
                        maxlength="10"
                        pattern="[0-9]{10}"
                        autocomplete="tel"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="registerPassword">Create Password</label>
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="At least 8 characters"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Enter password again"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="primary-btn" id="registerButton">
                    Create Account →
                </button>

            </form>

            <div class="switch-text" id="registerSwitch">
                Don't have an account?
                <button type="button" class="switch-btn" id="showRegister">
                    Create Account
                </button>
            </div>

            <div class="switch-text hidden" id="loginSwitch">
                Already have an account?
                <button type="button" class="switch-btn" id="showLogin">
                    Login
                </button>
            </div>

            <div class="role-notice" id="roleNotice"></div>

            <div class="message" id="authMessage"></div>

        </section>
    </main>

<script>
    const API_BASE = "http://127.0.0.1:8080";

    const params = new URLSearchParams(window.location.search);
    const role = params.get("role");

    const roleDetails = {
        admin: {
            title: "Administrator Login",
            label: "ADMIN PORTAL",
            icon: "🛡️",
            subtitle: "Sign in to manage the SmartWaste system.",
            notice: "Admin accounts are managed privately. Public registration is not available."
        },

        driver: {
            title: "Driver Login",
            label: "DRIVER PORTAL",
            icon: "🚛",
            subtitle: "Sign in to access your truck and collection assignments.",
            notice: "New drivers can submit an account request. Admin approval is required before login access is activated."
        },

        citizen: {
            title: "Citizen Login",
            label: "CITIZEN PORTAL",
            icon: "👥",
            subtitle: "Sign in to submit and track your waste-related complaints.",
            notice: "New citizens can create an account and access the Citizen Portal after successful registration."
        }
    };

    if (!roleDetails[role]) {
        window.location.replace("index.html");
    }

    const details = roleDetails[role];

    document.title = details.title + " | SmartWaste";
    document.getElementById("pageTitle").textContent = details.title;
    document.getElementById("roleLabel").textContent = details.label;
    document.getElementById("roleIcon").textContent = details.icon;
    document.getElementById("pageSubtitle").textContent = details.subtitle;
    document.getElementById("roleNotice").textContent = details.notice;

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const registerSwitch = document.getElementById("registerSwitch");
    const loginSwitch = document.getElementById("loginSwitch");
    const authMessage = document.getElementById("authMessage");

    function showMessage(message) {
        authMessage.textContent = message;
        authMessage.classList.add("show");
    }

    function openRegistration() {
        loginForm.classList.add("hidden");
        registerForm.classList.remove("hidden");

        registerSwitch.classList.add("hidden");
        loginSwitch.classList.remove("hidden");

        document.getElementById("pageTitle").textContent =
            role === "driver"
                ? "Driver Account Request"
                : "Create Citizen Account";

        document.getElementById("pageSubtitle").textContent =
            role === "driver"
                ? "Submit your details for Admin approval."
                : "Register to use SmartWaste citizen services.";

        authMessage.classList.remove("show");
    }

    function openLogin() {
        registerForm.classList.add("hidden");
        loginForm.classList.remove("hidden");

        loginSwitch.classList.add("hidden");
        registerSwitch.classList.remove("hidden");

        document.getElementById("pageTitle").textContent =
            details.title;

        document.getElementById("pageSubtitle").textContent =
            details.subtitle;

        authMessage.classList.remove("show");
    }

    if (role === "admin") {
        registerSwitch.classList.add("hidden");
    } else {
        document.getElementById("showRegister").addEventListener(
            "click", openRegistration
        );
    }

    document.getElementById("showLogin").addEventListener(
        "click", openLogin
    );

    document.getElementById("showPassword").addEventListener(
        "change", function () {
            document.getElementById("loginPassword").type =
                this.checked ? "text" : "password";
        }
    );

    // =====================================
    // LOGIN WITH C++ BACKEND
    // =====================================

    loginForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const button = loginForm.querySelector(
            'button[type="submit"]'
        );

        button.disabled = true;
        button.textContent = "Signing in...";

        try {
            const response = await fetch(
                `${API_BASE}/api/auth/login`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        role: role,
                        email: document.getElementById("loginEmail").value.trim(),
                        password: document.getElementById("loginPassword").value
                    })
                }
            );

            const result = await response.json();

            if (!response.ok || !result.success) {
                showMessage(result.message || "Login failed.");
                return;
            }

            if (result.role !== role || !result.token) {
                showMessage("Invalid login response. Please try again.");
                return;
            }

            // Save authenticated session for this browser tab
            sessionStorage.setItem(
                "smartwasteToken",
                result.token
            );

            sessionStorage.setItem(
                "smartwasteUser",
                JSON.stringify({
                    accountId: result.accountId,
                    name: result.name,
                    email: result.email,
                    phone: result.phone,
                    role: result.role,
                    status: result.status
                })
            );

            showMessage("Login successful! Opening your portal...");

            const portalPages = {
                admin: "admin/index.html",
                driver: "driver/index.html",
                citizen: "citizen/index.html"
            };

            window.location.href = portalPages[role];

        } catch (error) {
            console.error("Login error:", error);
            showMessage(
                "Could not connect to the server. Please check whether the SmartWaste API is running."
            );
        } finally {
            button.disabled = false;
            button.textContent = "Login to Portal →";
        }
    });

    // =====================================
    // REGISTRATION WITH C++ BACKEND
    // =====================================

    registerForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const password =
            document.getElementById("registerPassword").value;

        const confirm =
            document.getElementById("confirmPassword").value;

        if (password !== confirm) {
            showMessage("Passwords do not match. Please try again.");
            return;
        }

        const button = document.getElementById("registerButton");

        button.disabled = true;
        button.textContent = "Creating account...";

        try {
            const response = await fetch(
                `${API_BASE}/api/auth/register`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        role: role,
                        name: document.getElementById("registerName").value.trim(),
                        phone: document.getElementById("registerPhone").value.trim(),
                        email: document.getElementById("registerEmail").value.trim(),
                        password: password
                    })
                }
            );

            const result = await response.json();

            if (!response.ok || !result.success) {
                showMessage(result.message || "Registration failed.");
                return;
            }

            if (role === "driver") {
                showMessage(
                    "Your driver account request has been submitted. Please wait for Admin approval."
                );
            } else {
                const registeredEmail =
                    document.getElementById("registerEmail").value.trim();

                openLogin();

                document.getElementById("loginEmail").value =
                    registeredEmail;

                showMessage(
                    "Your Citizen account has been created successfully! Please log in."
                );

                registerForm.reset();
            }

        } catch (error) {
            console.error("Registration error:", error);

            showMessage(
                "Could not connect to the server. Please check whether the SmartWaste API is running."
            );
        } finally {
            button.disabled = false;
            button.textContent = "Create Account →";
        }
    });
</script>

</body>
</html>
